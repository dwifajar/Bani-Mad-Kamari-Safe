<style>.cloudbar{margin:10px 0;padding:9px 12px;border:1px solid #e4e8e2;background:#fff;font-size:12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{font-size:11px;color:#68736c}.formgrid input,.formgrid select,.formgrid textarea{width:100%;padding:10px;border:1px solid #ddd;margin-top:5px;font:12px Arial;box-sizing:border-box}.full{grid-column:1/-1}.crudbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.crudbar input,.crudbar select{padding:11px;border:1px solid #ddd}.crudbar button{padding:11px 15px;border:0;background:#214936;color:#fff;cursor:pointer}.table-box{background:#fff;border:1px solid #e2e5df;overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{background:#f1f3ee;text-align:left;font-size:10px;padding:12px}td{padding:12px;border-top:1px solid #edf0eb;font-size:12px}.action{border:0;background:none;color:#214936;font-weight:bold;cursor:pointer}.modal-bg{position:fixed;inset:0;background:#10281d88;display:none;align-items:center;justify-content:center;z-index:50}.modal-bg.show{display:flex}.modal{background:#fff;width:min(700px,94vw);max-height:90vh;overflow:auto;padding:28px}.modal h2{font:26px Georgia;color:#214936;margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.modal-actions button{padding:11px 16px;border:0;cursor:pointer}.save{background:#214936;color:#fff}.cancel{background:#eee}.thumb{width:70px;height:50px;object-fit:cover;border-radius:6px}@media(max-width:700px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
.bmk-date-field{margin-top:5px}.bmk-date-grid{display:grid;grid-template-columns:.8fr 1.35fr 1fr;gap:7px}.bmk-date-grid select{width:100%;padding:10px;border:1px solid #ddd;background:#fff;font:12px Arial;box-sizing:border-box}.bmk-date-help{display:block;margin-top:5px;color:#7b817b;font-size:11px}@media(max-width:520px){.bmk-date-grid{grid-template-columns:1fr 1.4fr 1fr}}
</style></head>

</nav><button id="logout" class="side-logout">Keluar</button></aside><main class="admin-main"><header class="admin-head"><div><span class="eyebrow">SUPABASE CRUD</span><h1>💰 Kas Reuni</h1><p>Data tersimpan di Supabase saat Cloud aktif.</p></div><a class="btn ghost" href="../index.html">Lihat Website ↗</a></header>
<div class="cloudbar">Status: <b data-bmk-mode>☁️ Supabase</b> · <span data-bmk-user></span></div><div class="crudbar"><input id="q" placeholder="🔎 Cari..."><button onclick="openForm()">＋ Tambah</button></div><div class="table-box"><table><thead><tr><th>TANGGAL</th><th>JENIS</th><th>KETERANGAN</th><th>NOMINAL</th><th>AKSI</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="modal-bg" id="modal"><div class="modal"><h2 id="mt">Tambah</h2><form id="form"><div class="formgrid"><label>Tanggal<div class="bmk-date-field" data-date-name="tanggal"></div><small class="bmk-date-help">Pilih tanggal, bulan, dan tahun dari daftar.</small></label><label>Jenis<select name="jenis"><option value="masuk">Masuk</option><option value="keluar">Keluar</option></select></label><label>Keterangan<input name="keterangan" type="text"></label><label>Nominal<input name="nominal" type="number"></label></div><div class="modal-actions"><button type="button" class="cancel" onclick="closeForm()">Batal</button><button class="save">Simpan</button></div></form></div></div></main>
<script>
document.getElementById("logout")?.addEventListener("click",()=>BMK.signOut());
(async()=>{ if(window.BMK?.cloud) await BMK.requireAuth(["super_admin","admin","editor"]); })();
let data=[],editId=null;BMKDateFields.initAll();async function load(){try{data=await BMK.db.get("kas","created_at",false);render()}catch(e){BMK.toast(e.message,"error")}}
function render(){let q=document.getElementById("q").value.toLowerCase();let a=data.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById("rows").innerHTML=a.map(x=>`<tr><td>${BMK.escape(x["tanggal"]??"-")}</td><td>${BMK.escape(x["jenis"]??"-")}</td><td>${BMK.escape(x["keterangan"]??"-")}</td><td>${BMK.escape(x["nominal"]??"-")}</td><td><button class="action" onclick="edit('${x.id}')">Edit</button> · <button class="action" onclick="del('${x.id}')">Hapus</button></td></tr>`).join("")}
document.getElementById("q").oninput=render;function openForm(x=null){editId=x?.id||null;document.getElementById("mt").textContent=x?"Edit":"Tambah";let f=document.getElementById("form");f.reset();if(x)for(let [k,v] of Object.entries(x))if(f.elements[k])f.elements[k].type==="checkbox"?f.elements[k].checked=!!v:f.elements[k].value=v??"";BMKDateFields.set(f,"tanggal",x?.tanggal||"");document.getElementById("modal").classList.add("show")}function closeForm(){document.getElementById("modal").classList.remove("show")}function edit(id){openForm(data.find(x=>x.id===id))}async function del(id){if(!(await BMK.confirm("Transaksi kas ini akan dihapus. Lanjutkan?")))return;try{await BMK.db.remove("kas",id);await load();BMK.toast("Dihapus","success")}catch(e){BMK.toast(e.message,"error")}}
document.getElementById("form").onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(e.target.querySelector('[type="checkbox"]'))o[e.target.querySelector('[type="checkbox"]').name]=e.target.querySelector('[type="checkbox"]').checked;try{if(editId)await BMK.db.update("kas",editId,o);else await BMK.db.insert("kas",o);closeForm();await load();BMK.toast("Tersimpan di Supabase","success")}catch(e){BMK.toast(e.message,"error")}};load();
</script></body></html>
