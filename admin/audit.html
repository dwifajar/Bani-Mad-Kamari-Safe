<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audit Log — BANI MAD KAMARI</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#18212f;--muted:#6b7280;--line:#e5e7eb;--accent:#1f6feb;--danger:#b42318;--shadow:0 12px 32px rgba(15,23,42,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1250px;margin:auto;padding:24px}.head{display:flex;gap:18px;align-items:center;justify-content:space-between;margin-bottom:20px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:800}.head h1{margin:5px 0 4px;font-size:28px}.head p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;text-decoration:none;color:var(--ink);font-weight:700;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px}.filters{display:grid;grid-template-columns:1.7fr 1fr 1fr auto;gap:10px;margin-bottom:16px}.input,.select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;color:var(--ink);font:inherit}.status{margin:0 0 14px;color:var(--muted);font-size:13px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:12px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{background:#f8fafc;font-size:12px;color:#475467}.table td{font-size:13px}.table tr:last-child td{border-bottom:0}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2ff}.badge.insert{background:#ecfdf3;color:#067647}.badge.update{background:#eff8ff;color:#175cd3}.badge.delete{background:#fef3f2;color:#b42318}.muted{color:var(--muted)}.detail{max-width:420px;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;background:#f8fafc;padding:8px;border-radius:8px}.empty{text-align:center;padding:35px;color:var(--muted)}.pager{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;align-items:center}.pill{font-size:12px;padding:5px 9px;border-radius:999px;background:#f2f4f7;color:#475467}.back{margin-bottom:14px;display:inline-block}@media(max-width:800px){.wrap{padding:14px}.head{align-items:flex-start;flex-direction:column}.filters{grid-template-columns:1fr}.head h1{font-size:23px}}
</style>
</head>
<body>
<div class="wrap">
<a class="btn back" href="index.html">← Kembali ke Dashboard</a>
<div class="head"><div><div class="eyebrow">KEAMANAN & RIWAYAT</div><h1>📝 Audit Log Admin</h1><p>Riwayat perubahan data yang dilakukan oleh pengguna admin.</p></div><button class="btn primary" id="refreshBtn">↻ Segarkan</button></div>
<div class="panel">
<div class="filters">
<input class="input" id="search" type="search" placeholder="Cari nama, tabel, record, atau detail…">
<select class="select" id="action"><option value="">Semua aksi</option><option value="INSERT">Tambah</option><option value="UPDATE">Ubah</option><option value="DELETE">Hapus</option></select>
<select class="select" id="module"><option value="">Semua modul</option></select>
<button class="btn" id="clearBtn">Reset</button>
</div>
<div class="status" id="status">Memuat audit log…</div>
<div class="table-wrap"><table class="table"><thead><tr><th>Waktu</th><th>Pengguna</th><th>Aksi</th><th>Modul</th><th>Record</th><th>Perubahan</th></tr></thead><tbody id="rows"><tr><td colspan="6" class="empty">Memuat data…</td></tr></tbody></table></div>
<div class="pager"><button class="btn" id="prev">← Sebelumnya</button><span class="pill" id="pageInfo">Halaman 1</span><button class="btn" id="next">Berikutnya →</button></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/cloud.js"></script>
<script src="../assets/js/admin.js"></script>
<script>
(async function(){
  const B=window.BMK;
  if(!B?.supabase){document.getElementById('status').textContent='Supabase belum terhubung.';return;}
  const ok=await B.requireAuth(['super_admin','admin','editor']); if(!ok)return;
  const sb=B.supabase;
  const PAGE=50; let page=0; let allModules=[];
  const rowsEl=document.getElementById('rows'), statusEl=document.getElementById('status'), moduleEl=document.getElementById('module');
  const esc=v=>B.escape?B.escape(String(v??'')):String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function fmtDate(v){try{return new Date(v).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'});}catch{return v||'-'}}
  function details(r){
    const old=r.old_data&&typeof r.old_data==='object'?r.old_data:null, neu=r.new_data&&typeof r.new_data==='object'?r.new_data:null;
    if(r.action==='INSERT') return esc(JSON.stringify(neu,null,2));
    if(r.action==='DELETE') return esc(JSON.stringify(old,null,2));
    if(r.action==='UPDATE'){
      const keys=new Set([...Object.keys(old||{}),...Object.keys(neu||{})]); const diff={};
      keys.forEach(k=>{const a=old?.[k],b=neu?.[k]; if(JSON.stringify(a)!==JSON.stringify(b)) diff[k]={sebelum:a,sesudah:b};});
      return esc(JSON.stringify(diff,null,2));
    }
    return '';
  }
  function labelAction(a){return a==='INSERT'?'Tambah':a==='UPDATE'?'Ubah':a==='DELETE'?'Hapus':a||'-'}
  async function loadModules(){
    const {data,error}=await sb.from('audit_logs').select('table_name').order('created_at',{ascending:false}).limit(1000);
    if(error)return; allModules=[...new Set((data||[]).map(x=>x.table_name).filter(Boolean))].sort();
    moduleEl.innerHTML='<option value="">Semua modul</option>'+allModules.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
  }
  async function load(){
    rowsEl.innerHTML='<tr><td colspan="6" class="empty">Memuat data…</td></tr>';
    const search=document.getElementById('search').value.trim(), action=document.getElementById('action').value, module=moduleEl.value;
    let q=sb.from('audit_logs').select('id,created_at,actor_name,actor_role,action,table_name,record_id,old_data,new_data',{count:'exact'}).order('created_at',{ascending:false}).range(page*PAGE,(page+1)*PAGE-1);
    if(action)q=q.eq('action',action); if(module)q=q.eq('table_name',module);
    if(search)q=q.or(`actor_name.ilike.%${search}%,table_name.ilike.%${search}%,record_id.ilike.%${search}%`);
    const {data,error,count}=await q;
    if(error){statusEl.textContent='Audit Log belum siap: '+error.message; rowsEl.innerHTML='<tr><td colspan="6" class="empty">Pastikan SQL Audit Log sudah dijalankan di Supabase.</td></tr>';return;}
    statusEl.textContent=`Menampilkan ${(data||[]).length} dari ${count??0} catatan.`;
    rowsEl.innerHTML=data?.length?data.map(r=>`<tr><td>${esc(fmtDate(r.created_at))}</td><td><b>${esc(r.actor_name||'Administrator')}</b><br><span class="muted">${esc(r.actor_role||'')}</span></td><td><span class="badge ${String(r.action||'').toLowerCase()}">${esc(labelAction(r.action))}</span></td><td>${esc(r.table_name||'-')}</td><td><span class="muted">${esc(r.record_id||'-')}</span></td><td><div class="detail">${details(r)||'-'}</div></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Belum ada aktivitas yang tercatat.</td></tr>';
    document.getElementById('pageInfo').textContent=`Halaman ${page+1}`;
    document.getElementById('prev').disabled=page===0; document.getElementById('next').disabled=!data||data.length<PAGE;
  }
  document.getElementById('refreshBtn').onclick=async()=>{await loadModules();await load()};
  document.getElementById('clearBtn').onclick=()=>{document.getElementById('search').value='';document.getElementById('action').value='';moduleEl.value='';page=0;load()};
  ['search','action','module'].forEach(id=>document.getElementById(id).addEventListener(id==='search'?'input':'change',()=>{page=0;load()}));
  document.getElementById('prev').onclick=()=>{if(page>0){page--;load()}}; document.getElementById('next').onclick=()=>{page++;load()};
  await loadModules(); await load();
})();
</script>
</body>
</html>
