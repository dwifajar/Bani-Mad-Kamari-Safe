<style>.cloudbar{margin:10px 0;padding:9px 12px;border:1px solid #e4e8e2;background:#fff;font-size:12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{font-size:11px;color:#68736c}.formgrid input,.formgrid select,.formgrid textarea{width:100%;padding:10px;border:1px solid #ddd;margin-top:5px;font:12px Arial;box-sizing:border-box}.full{grid-column:1/-1}.crudbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.crudbar input,.crudbar select{padding:11px;border:1px solid #ddd}.crudbar button{padding:11px 15px;border:0;background:#214936;color:#fff;cursor:pointer}.table-box{background:#fff;border:1px solid #e2e5df;overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th{background:#f1f3ee;text-align:left;font-size:10px;padding:12px}td{padding:12px;border-top:1px solid #edf0eb;font-size:12px}.action{border:0;background:none;color:#214936;font-weight:bold;cursor:pointer}.modal-bg{position:fixed;inset:0;background:#10281d88;display:none;align-items:center;justify-content:center;z-index:50}.modal-bg.show{display:flex}.modal{background:#fff;width:min(700px,94vw);max-height:90vh;overflow:auto;padding:28px}.modal h2{font:26px Georgia;color:#214936;margin-top:0}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.modal-actions button{padding:11px 16px;border:0;cursor:pointer}.save{background:#214936;color:#fff}.cancel{background:#eee}.thumb{width:70px;height:50px;object-fit:cover;border-radius:6px}@media(max-width:700px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head>

</nav><button id="logout" class="side-logout">Keluar</button></aside><main class="admin-main"><header class="admin-head"><div><span class="eyebrow">SUPABASE CRUD</span><h1>⚙ Pengaturan</h1><p>Data tersimpan di Supabase saat Cloud aktif.</p></div><a class="btn ghost" href="../index.html">Lihat Website ↗</a></header>
<div class="cloudbar">Status: <b data-bmk-mode>☁️ Supabase</b> · <span data-bmk-user></span></div><section class="panel"><div class="panel-head"><h2>Pengaturan Website</h2></div><form id="form"><div class="formgrid"><label>Nama keluarga<input name="nama_keluarga" required></label><label>Logo<input name="file" type="file" accept="image/*"></label><label class="full">Deskripsi<textarea name="deskripsi"></textarea></label></div><div class="modal-actions"><button class="save">Simpan Pengaturan</button></div></form><div id="preview" style="margin-top:20px"></div></section></main>
<script>
document.getElementById("logout")?.addEventListener("click",()=>BMK.signOut());
(async()=>{ if(window.BMK?.cloud) await BMK.requireAuth(["super_admin","admin","editor"]); })();
async function load(){try{let a=await BMK.db.get("pengaturan","id",true);let x=a[0]||{};for(let k of ["nama_keluarga","deskripsi"])document.querySelector(`[name="${k}"]`).value=x[k]||"";if(x.logo_url)document.getElementById("preview").innerHTML=`<img class="thumb" style="width:100px;height:100px" src="${x.logo_url}">`;window.cur=x}catch(e){BMK.toast(e.message,"error")}}document.getElementById("form").onsubmit=async e=>{e.preventDefault();try{let f=new FormData(e.target),row={id:1,nama_keluarga:f.get("nama_keluarga"),deskripsi:f.get("deskripsi")};let file=f.get("file");if(file?.size){let up=await BMK.file.upload(file,"settings");row.logo_url=up.url;row.logo_path=up.path}await BMK.supabase.from("pengaturan").upsert(row);await load();BMK.toast("Pengaturan tersimpan","success")}catch(e){BMK.toast(e.message,"error")}};load();
</script></body></html>
