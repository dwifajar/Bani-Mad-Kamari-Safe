<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — BANI MAD KAMARI</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/cloud.js"></script></head><body><main style="min-height:100vh;display:grid;place-items:center;padding:20px"><section class="panel" style="width:min(460px,94vw);padding:30px"><span class="eyebrow">BANI MAD KAMARI</span><h1>Login Admin</h1><div id="confirmBox" style="display:none;margin:14px 0;padding:15px;border-radius:10px;border:1px solid #cfe4d5;background:#f1faf4;color:#214936;font-size:13px;line-height:1.55"><strong style="display:block;margin-bottom:4px">✓ Konfirmasi email berhasil</strong><span id="confirmText">Alamat email Anda sudah berhasil dikonfirmasi. Silakan masuk menggunakan akun yang telah dibuat.</span></div><p id="msg">Masuk menggunakan akun sesuai hak akses Anda.</p><form id="login"><label>Email<input name="email" type="email" autocomplete="username" required style="width:100%;padding:12px;margin:6px 0 12px"></label><label>Password<input name="password" type="password" autocomplete="current-password" required style="width:100%;padding:12px;margin:6px 0 18px"></label><button id="loginBtn" class="btn primary" style="width:100%">Masuk</button></form><p id="roleMsg" style="font-size:12px;color:#176b55;min-height:18px"></p><a href="index.html">← Kembali ke website</a></section></main><script>
(function(){
 const confirmBox=document.getElementById("confirmBox"),msg=document.getElementById("msg"),roleMsg=document.getElementById("roleMsg");
 const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.replace(/^#/,""));
 const confirmed=params.get("confirmed")==="1"||params.get("confirmation")==="success"||hash.get("type")==="signup";
 if(confirmed){
   confirmBox.style.display="block";
   document.getElementById("confirmText").innerHTML="<b>Alamat email berhasil dikonfirmasi.</b><br>Silakan login secara manual menggunakan alamat email yang terdaftar dan password yang diberikan oleh Super Admin.";
   msg.textContent="Konfirmasi berhasil. Anda belum login.";
   roleMsg.textContent="Masukkan email dan password pada form di bawah.";
   roleMsg.style.color="#176b55";
   try{history.replaceState({},document.title,"login.html")}catch(e){}
 }
})();

document.getElementById("login").addEventListener("submit",async function(e){
  e.preventDefault();
  const msg=document.getElementById("msg"),roleMsg=document.getElementById("roleMsg"),btn=document.getElementById("loginBtn");
  if(!window.BMK?.cloud){msg.textContent="Supabase belum dikonfigurasi. Periksa assets/js/supabase-config.js.";return}
  const f=new FormData(this),email=String(f.get("email")||"").trim(),password=String(f.get("password")||"");
  btn.disabled=true;btn.textContent="Memeriksa...";msg.textContent="Memeriksa akun...";roleMsg.textContent="";
  try{
    const {data,error}=await BMK.supabase.auth.signInWithPassword({email,password});
    if(error){
      const text=String(error.message||"");
      if(/email.*confirm|confirmed|not confirmed/i.test(text)){
        throw new Error("Email belum dikonfirmasi. Silakan buka email konfirmasi terlebih dahulu.");
      }
      throw error;
    }
    if(!data?.session)throw new Error("Session login belum tersedia.");
    const {data:p}=await BMK.supabase.from("profiles").select("nama,role").eq("id",data.user.id).maybeSingle();
    const role=p?.role||"editor";
    const label=role==="super_admin"?"Super Admin":role==="admin"?"Admin":"Editor";
    msg.textContent="Login berhasil.";
    roleMsg.textContent="Hak akses: "+label+". Membuka halaman admin...";
    roleMsg.style.color="#176b55";
    btn.textContent="Berhasil";
    location.replace("admin/index.html");
  }catch(err){
    msg.textContent=err?.message||"Login gagal.";msg.style.color="#b91c1c";
    roleMsg.textContent="";
    btn.disabled=false;btn.textContent="Masuk";
  }
});
</script></body></html>
